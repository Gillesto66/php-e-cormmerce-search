# Dépôt miroir du paquet Packagist : les tests doivent passer SANS le monorepo (fixtures embarquées).
# Ne pas modifier le code ici : il est synchronisé depuis php-engine/ du monorepo (scripts/sync_php_repo.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
